<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>2択クイズ</title></head>
<body>
    <h2>第 [[${playForm.currentIdx + 1}]] 問（2択）</h2>
    <p th:text="${quiz.question}"></p>
    <form th:action="@{/play/answer}" method="post">
        <button type="submit" name="answer" value="1">〇 正解（True）</button>
        <button type="submit" name="answer" value="0">× 不正解（False）</button>
    </form>
</body>
</html>
